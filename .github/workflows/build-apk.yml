name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Ensure Persistent Debug Keystore
        run: |
          mkdir -p signing
          if [ ! -f signing/debug.keystore ]; then
            echo "Generating persistent debug keystore..."
            keytool -genkey -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "ci: persist permanent debug keystore for consistent APK update signatures [skip ci]" || true
            git push origin main || true
          fi

      - name: Build Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Clarity
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/Flora-Music-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flora-Music-debug-apk
          path: build-output/Flora-Music-debug.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Flora Music (Latest APK Build)"
          body: |
            ### 🌸 Flora Music - Latest Build
            
            Automated build generated by GitHub Actions.
            
            **Cara Install di HP:**
            1. Download file `Flora-Music-debug.apk` di bawah langsung dari browser HP Anda.
            2. Buka file yang selesai diunduh dan pilih **Install**.
            3. Jika muncul konfirmasi *"Install unknown apps"*, aktifkan izinnya.
          prerelease: true
          files: build-output/Flora-Music-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
